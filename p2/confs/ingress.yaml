apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  namespace: default
spec:
  rules:
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1
                port:
                  number: 80
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2
                port:
                  number: 80
    # Pas de "host" ici : Traefik traite cette regle comme le catch-all,
    # applique seulement si aucune regle avec host ci-dessus ne correspond.
    # (spec.defaultBackend est mal supporte par le controller Traefik de K3s,
    # d'ou l'usage de cette syntaxe a la place.)
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3
                port:
                  number: 80